# Local development stack: Mealie, an Authentik stand-in, and this MCP server
# built from the Dockerfile. Ports bind to localhost only. See the README's
# "Local development stack" section; never point it at a deployed instance.
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:${MEALIE_VERSION:-v3.28.0}
    ports:
      - "127.0.0.1:9925:9000"
    environment:
      ALLOW_SIGNUP: "false"
      BASE_URL: http://localhost:9925
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - mealie-data:/app/data/
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/app/about', timeout=5)"
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 20s

  # Answers the server's two Authentik calls from dev/tokens.json (dev/seed.py).
  authentik-stub:
    image: python:3.12-slim
    command: ["python", "/app/authentik_stub.py"]
    environment:
      AUTHENTIK_TOKEN: dev-stub-token
      TOKENS_FILE: /data/tokens.json
    volumes:
      - ./dev/authentik_stub.py:/app/authentik_stub.py:ro
      - ./dev:/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://localhost:9001/api/v3/core/users/me/', headers={'Authorization': 'Bearer dev-stub-token'}), timeout=5)"
      interval: 5s
      timeout: 6s
      retries: 10

  mealie-mcp:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      MEALIE_BASE_URL: http://mealie:9000
      AUTHENTIK_URL: http://authentik-stub:9001
      AUTHENTIK_TOKEN: dev-stub-token
      MEALIE_TOKEN_CACHE_TTL: "0"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
      LOG_LEVEL: INFO
    depends_on:
      mealie:
        condition: service_healthy
      authentik-stub:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('localhost', 8765), 3)"
      interval: 3s
      timeout: 4s
      retries: 20

volumes:
  mealie-data:
